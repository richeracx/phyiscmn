<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Outer Anodized Ring -->
  <circle cx="32" cy="32" r="30" fill="#0C1018" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" stroke="rgba(255, 255, 255, 0.06)" stroke-width="0.75" stroke-dasharray="2 3"/>
  
  <!-- Optical Calibration Ticks -->
  <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="1">
    <line x1="32" y1="3" x2="32" y2="6" />
    <line x1="32" y1="58" x2="32" y2="61" />
    <line x1="3" y1="32" x2="6" y2="32" />
    <line x1="58" y1="32" x2="61" y2="32" />
    <line x1="11.5" y1="11.5" x2="13.6" y2="13.6" />
    <line x1="50.4" y1="50.4" x2="52.5" y2="52.5" />
    <line x1="11.5" y1="52.5" x2="13.6" y2="50.4" />
    <line x1="50.4" y1="13.6" x2="52.5" y2="11.5" />
  </g>

  <!-- Aperture Iris Blades -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" stroke-linecap="round">
    <line x1="18" y1="20" x2="38" y2="16" />
    <line x1="38" y1="16" x2="48" y2="30" />
    <line x1="48" y1="30" x2="42" y2="46" />
    <line x1="42" y1="46" x2="24" y2="48" />
    <line x1="24" y1="48" x2="14" y2="34" />
    <line x1="14" y1="34" x2="18" y2="20" />
  </g>

  <!-- Electric-Blue Laser Beam -->
  <defs>
    <linearGradient id="laserGlowFavicon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E8BFF" stop-opacity="0.1" />
      <stop offset="45%" stop-color="#2E8BFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#BAE0FF" stop-opacity="1" />
      <stop offset="55%" stop-color="#2E8BFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2E8BFF" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <line x1="8" y1="56" x2="56" y2="8" stroke="#2E8BFF" stroke-width="3" stroke-opacity="0.25" stroke-linecap="round" />
  <line x1="8" y1="56" x2="56" y2="8" stroke="url(#laserGlowFavicon)" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Focal Optical Core -->
  <circle cx="32" cy="32" r="2.5" fill="#BAE0FF" />

  <!-- Silver-White Geometric "P" -->
  <path d="M 24 44 L 24 20 L 34 20 C 38.5 20 41 22.5 41 27 C 41 31.5 38.5 34 34 34 L 24 34" 
        stroke="#F1F5F9" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>
